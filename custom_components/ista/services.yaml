download_receipt:
  name: Descargar factura Ista
  description: Descarga el archivo PDF de una factura de Ista al almacenamiento local de Home Assistant.
  fields:
    receipt_id:
      name: ID de recibo
      description: Identificador del recibo (opcional, por defecto se descarga la última factura emitida).
      example: "N5p2KpC_L2bbQ_T56lPZdg"
      selector:
        text:
    target_path:
      name: Ruta de destino
      description: Ruta absoluta en disco donde guardar el archivo PDF (opcional, por defecto se guarda en /config/www/ista_facturas/).
      example: "/config/www/ista_facturas/mi_factura.pdf"
      selector:
        text:

import_history:
  name: Importar histórico de lecturas Ista
  description: Importa las lecturas acumuladas históricas (mensuales y diarias por radio) desde la web de Ista a las estadísticas a largo plazo (LTS) de Home Assistant.
  fields:
    device_group:
      name: Servicio / Contador
      description: Filtrar por tipo de contador a importar (opcional, por defecto importa tanto agua caliente como calefacción).
      example: "hot_water"
      selector:
        select:
          options:
            - label: Agua Caliente
              value: hot_water
            - label: Calefacción
              value: heating

